name: knowpipe
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: knowpipe
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment: &environment
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: '1'
      MONGO_URI: mongodb://knowpipe:${MONGO_PASSWORD}@mongo:27017/knowpipe_mining?authSource=admin
      MONGO_DB: knowpipe_mining
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend, edge]
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *environment
      SPARK_MASTER: local[2]
      KNOWPIPE_ASR_MODEL_PATH: /var/lib/knowpipe/models/faster-whisper-tiny
      KNOWPIPE_MODEL_THREADS: '2'
    volumes:
      - ./state/feature009/media:/var/lib/knowpipe/models:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend, edge]
  recommendation-worker:
    build:
      context: .
      target: worker
    command: ["python", "-m", "knowpipe.recommendations.worker"]
    restart: unless-stopped
    environment:
      <<: *environment
      SPARK_MASTER: local[2]
      LEARNING_INDEX_ROOT: /var/lib/knowpipe/recommendations
      KNOWPIPE_TRANSLATION_MODEL_PATH: /var/lib/knowpipe/models/translate-en_zh-1_9
      KNOWPIPE_GOAL_TRANSLATION_MODEL_PATH: /var/lib/knowpipe/goal-model
      KNOWPIPE_MODEL_THREADS: '2'
      LEARNING_MAX_PARAGRAPHS: '1000000'
    volumes:
      - recommendation_cache:/var/lib/knowpipe/recommendations
      - ./state/feature009/media:/var/lib/knowpipe/models:ro
      - ./state/feature010/media/translate-zh_en-1_9:/var/lib/knowpipe/goal-model:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend, edge]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]
volumes:
  recommendation_cache:
  mongo_data:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  edge:
